server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Re-resolve upstream DNS every 5s (required for container networking
    # where backend IPs change across restarts).
    # Placeholder replaced by entrypoint; defaults to Docker's embedded DNS.
    resolver __DNS_RESOLVER__ valid=5s;

    # Runtime config — never cache so env changes take effect immediately.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Hashed static assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Upstream variables — resolved dynamically via the resolver directive.
    # Placeholders replaced by sed in the entrypoint script.
    set $gateway_upstream __GATEWAY_UPSTREAM__;
    set $workbench_upstream __WORKBENCH_UPSTREAM__;

    # Data Platform routes.
    location /api/ {
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Studio Workbench routes.
    location /workbench/ {
        proxy_pass http://$workbench_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SPA history-mode fallback — serve index.html for all non-file paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
